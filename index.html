<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>Hold'em EV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #0d2a1f; --felt-2: #11352a; --felt-deep: #081b14;
    --ink: #eef3ee; --dim: #9db3a7; --faint: #6b8a7c; --line: #24473a;
    --gold: #e6c06a; --gold-dim: #a8873f;
    --good: #57d68d; --bad: #ff7a6e; --warn: #f2c35b;
    --raise: #d9473f; --check: #3a4a44;
    --card: #fbfaf6; --card-line: #d6d2c6;
    --s: #1d1d1f; --h: #d8343b; --d: #2563c9; --c: #1f8a4c;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--felt-deep); min-height: 100%; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 15px; line-height: 1.45; min-height: 100vh;
    background: radial-gradient(ellipse 90% 520px at 50% -10%, #17463a 0%, transparent 70%), linear-gradient(180deg, var(--felt) 0%, var(--felt-deep) 700px);
  }
  button { font-family: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: 32px; letter-spacing: -0.01em; line-height: 1; }
  h1 span { color: var(--gold); }
  .seg { display: inline-flex; background: var(--felt-deep); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: 0; color: var(--dim); font-weight: 600; font-size: 14px; padding: 7px 13px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--gold); color: #1c1606; }
  .seg button:not(.on):hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  .panel { background: rgba(8, 27, 20, 0.72); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .ptitle { font-family: var(--serif); font-weight: 600; font-size: 17px; display: flex; align-items: baseline; gap: 10px; }
  .ptitle small { font-family: 'IBM Plex Sans'; font-size: 13px; color: var(--faint); font-weight: 400; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

  /* Slots */
  .slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .slotgroup { flex: 1 1 auto; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; transition: border-color .15s, background .15s; min-width: 0; }
  .slotgroup.wide { flex-basis: 100%; }
  .slotgroup:hover { border-color: #3a6b58; }
  .slotgroup.active { border-color: var(--gold); background: rgba(230, 192, 106, 0.06); }
  .slothead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; white-space: nowrap; }
  .slothead b { font-weight: 600; font-size: 13px; }
  .slothead span { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
  .slotcards { display: flex; flex-wrap: wrap; gap: 6px; min-height: 56px; align-items: center; }
  .clear { background: none; border: 0; color: var(--faint); font-size: 12px; cursor: pointer; padding: 0 2px; }
  .clear:hover { color: var(--bad); }

  .pc { width: 40px; height: 56px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-line); display: flex; flex-direction: column; align-items: center; justify-content: center;
        font: 600 18px var(--mono); line-height: 1; box-shadow: 0 2px 0 rgba(0,0,0,.25); position: relative; cursor: pointer; flex: none; }
  .pc i { font-style: normal; font-size: 16px; margin-top: 2px; }
  .ts { color: #e3e9e5; } .th { color: #ff7d7d; } .td { color: #74adff; } .tc { color: #5fd38f; }
  .s { color: var(--s); } .h { color: var(--h); } .d { color: var(--d); } .c { color: var(--c); }
  .pc.empty { background: transparent; border: 1.5px dashed #3a6b58; box-shadow: none; color: var(--faint); }
  .pc .x { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #2a1414; color: #ffb3ab; font-size: 10px; display: none; align-items: center; justify-content: center; }
  .pc:hover .x { display: flex; }
  .pc.off { opacity: 0.28; }
  .pc.empty.off { border-style: dotted; }
  .slotcards .gap { width: 8px; flex: none; }

  /* Desktop picker: the whole deck */
  .picker { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
  .pk { aspect-ratio: 5 / 7; border-radius: 5px; background: var(--card); border: 1px solid var(--card-line); font: 600 14px var(--mono); display: flex; flex-direction: column;
        align-items: center; justify-content: center; line-height: 1; cursor: pointer; user-select: none; transition: transform .08s; }
  .pk i { font-style: normal; font-size: 12px; }
  .pk:hover { transform: translateY(-2px); }
  .pk.used { opacity: 0.16; cursor: default; transform: none; }
  /* Mobile picker: rank then suit */
  .keypad { display: none; margin-top: 14px; }
  .kp-ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .kp-suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .kp { height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--felt-2); color: var(--ink); font: 600 18px var(--mono); cursor: pointer; }
  .kp.on { background: var(--gold); color: #1c1606; border-color: var(--gold); }
  .kp:disabled { opacity: 0.25; cursor: default; }
  .kp-suits .kp { background: var(--card); border-color: var(--card-line); font-size: 24px; height: 50px; }
  .kp-suits .kp:disabled { opacity: 0.35; }
  .pickhint { font-size: 13px; color: var(--dim); margin-top: 10px; }
  .pickhint b { color: var(--gold); font-weight: 600; }

  /* Results pane */
  .pane .tabs { margin-bottom: 14px; }
  .sheet-head { display: none; }
  .verdict { border-radius: 12px; padding: 14px 16px; background: linear-gradient(135deg, rgba(230,192,106,0.14), rgba(230,192,106,0.03)); border: 1px solid rgba(230,192,106,0.45); }
  .verdict .act { font-family: var(--serif); font-size: 30px; font-weight: 800; line-height: 1.05; }
  .act.bet, .chip.bet { color: var(--good); } .act.check, .chip.check { color: var(--warn); } .act.fold, .chip.fold { color: var(--bad); }
  .verdict .why { margin-top: 6px; color: var(--dim); font-size: 14px; }
  .verdict .why b, .mono { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .close { color: var(--warn); }
  .flip { color: var(--gold); font-weight: 600; }

  h3 { font-family: var(--serif); font-weight: 600; font-size: 15px; margin: 18px 0 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th { text-align: right; font-weight: 500; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 8px; text-align: right; border-bottom: 1px solid rgba(36,71,58,0.5); font-family: var(--mono); font-weight: 500; white-space: nowrap; }
  td:first-child { font-family: 'IBM Plex Sans'; font-weight: 600; white-space: normal; }
  tr.best td { background: rgba(87,214,141,0.08); }
  tr.best td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  td.tot { font-weight: 600; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--dim); }
  .chip { font-family: 'IBM Plex Sans'; font-weight: 600; }
  .impact td:first-child .mini { font-family: var(--mono); font-weight: 600; }
  .pending { color: var(--faint); font-style: italic; font-family: 'IBM Plex Sans'; font-weight: 400; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .v { font-family: var(--mono); font-size: 14px; margin-top: 3px; }
  .bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 7px; background: var(--line); }
  .bar span { display: block; height: 100%; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--dim); font-size: 14px; }
  summary:hover { color: var(--ink); }
  .note { font-size: 12.5px; color: var(--faint); margin-top: 8px; }
  .progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
  .empty { color: var(--dim); text-align: center; padding: 36px 10px; }
  .empty .big { font-family: var(--serif); font-size: 21px; color: var(--ink); margin-bottom: 6px; }

  /* Range chart */
  .chart-head { font-size: 14px; color: var(--dim); margin-bottom: 10px; }
  .chart-head b { color: var(--ink); }
  .rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; background: #0a1611; border-radius: 8px; padding: 3px; }
  .rc { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: #fff; border-radius: 3px; cursor: pointer; position: relative; user-select: none; }
  .rc { text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .rc.wait { background: #1b2b25 !important; color: var(--faint); text-shadow: none; }
  .rc.blocked { background: #0f1a16; color: #33473f; cursor: default; text-shadow: none; }
  .legend small { color: var(--faint); font-size: 12px; }
  .rc.chg::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--gold); border-radius: 3px; }
  .rc.sel { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--dim); align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
  .chart-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--dim); cursor: pointer; }
  .chk input { accent-color: var(--gold); }

  /* Settings */
  .settings { margin-top: 18px; }
  .settings > summary { list-style: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .settings > summary::-webkit-details-marker { display: none; }
  .settings > summary::before { content: '⚙'; color: var(--gold); }
  .settings > summary .ptitle { display: inline; }
  .settings > summary .sum { color: var(--faint); font-size: 13px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .opt label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .opt .chk { text-transform: none; letter-spacing: 0; font-size: 14px; margin-right: 10px; display: inline-flex; }
  select, .money { width: 100%; background: var(--felt-deep); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 500 14px 'IBM Plex Sans'; }
  .money { font-family: var(--mono); }
  footer { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--faint); }
  footer input { background: var(--felt-deep); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 6px 9px; font: 14px 'IBM Plex Sans'; }
  footer button { background: var(--felt-2); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

  .mbar { display: none; }

  /* ── Mobile: one column; results become a bottom sheet ── */
  @media (max-width: 860px) {
    .wrap { padding: 16px 12px 96px; }
    h1 { font-size: 26px; }
    header { margin-bottom: 12px; }
    .layout { grid-template-columns: 1fr; }
    .panel { padding: 13px; }
    .picker { display: none; }
    .keypad { display: block; }
    .pc { width: 38px; height: 52px; font-size: 17px; }
    .slots { gap: 8px; }
    .slotgroup:not(.wide) { flex: 1 1 0; padding: 8px 9px; }
    .slotgroup:not(.wide) .slothead span { display: none; }
    .slotcards { min-height: 52px; }
    .pane { position: fixed; left: 0; right: 0; bottom: 0; top: 7vh; z-index: 50; border-radius: 18px 18px 0 0; overflow-y: auto; padding: 0 14px 30px;
            transform: translateY(105%); transition: transform .25s ease; background: #0b1f18; border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
    .pane.open { transform: none; box-shadow: 0 -10px 40px rgba(0,0,0,.6); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #0b1f18; padding: 10px 0 10px; z-index: 2; }
    .sheet-head::before { content: ''; position: absolute; left: 50%; top: 5px; width: 40px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
    .sheet-close { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 5px 12px; font-size: 14px; }
    .pane .tabs { margin: 6px 0 12px; }
    .mbar { display: flex; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40; align-items: center; gap: 12px;
            background: #0f2a20; border: 1px solid var(--gold-dim); border-radius: 14px; padding: 11px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.55); cursor: pointer; }
    .mbar .mact { font-family: var(--serif); font-weight: 800; font-size: 20px; }
    .mbar .mtxt { flex: 1; font-size: 13px; color: var(--dim); line-height: 1.3; min-width: 0; }
    .mbar .mtxt b { color: var(--ink); font-family: var(--mono); }
    .mbar .mopen { color: var(--gold); font-weight: 600; font-size: 14px; white-space: nowrap; }
    body.sheet-open { overflow: hidden; }
    .rc { font-size: 9px; }
    td, th { padding: 7px 5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hold'em <span>EV</span></h1>
    <div class="seg" id="gameSeg">
      <button data-g="uth">Ultimate Texas</button>
      <button data-g="wpt">WPT Heads-Up</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="row">
        <div class="seg" id="streetSeg">
          <button data-s="preflop">Preflop</button>
          <button data-s="flop">Flop</button>
          <button data-s="river">River</button>
        </div>
        <button class="clear" id="clearAll">Clear all cards</button>
      </div>
      <div class="slots" id="slots"></div>
      <div class="picker" id="picker"></div>
      <div class="keypad" id="keypad"></div>
      <div class="pickhint" id="pickhint"></div>
    </section>

    <aside class="panel pane" id="pane">
      <div class="sheet-head"><span class="ptitle">Results</span><button class="sheet-close" id="sheetClose">Close</button></div>
      <div class="seg tabs" id="tabSeg">
        <button data-t="hand">This hand</button>
        <button data-t="chart">Range chart</button>
      </div>
      <div id="tabHand"></div>
      <div id="tabChart"></div>
    </aside>
  </div>

  <details class="panel settings" id="settings">
    <summary><span class="ptitle">Table settings</span><span class="sum" id="setSum"></span></summary>
    <div class="opts" id="opts"></div>
  </details>

  <footer>
    <span id="kvStatus">Shared cache: off</span><span>· build 2026-10-26 19:45</span>
    <span style="flex:1"></span>
    <span id="tokenArea"></span>
  </footer>
</div>
<div class="mbar" id="mbar"></div>

<script id="engine-src">
/*
 * Hold'em table-game EV engine (Ultimate Texas Hold'em, WPT Heads-Up Hold'em).
 *
 * Exact enumeration, not simulation. Two phases:
 *   1. Board stats (game-independent): for every possible completion of the board, count how the
 *      dealer's possible hands fare against ours: W/L (all dealer hands) and Wq/Lq (dealer
 *      qualifies), plus our hand's category. Rank-pair tables make this ~91 lookups per board
 *      instead of ~990 hand evaluations.
 *   2. Decisions (per game + paytable): walk river → flop → preflop, taking the better action at
 *      each node (backward induction), summing EVs per bet spot.
 *
 * Cards: id = rank*4 + suit, rank 0..12 = 2..A, suit 0..3 = s h d c.
 */
(function (root) {
  'use strict';
  const RANKS = '23456789TJQKA', SUITS = 'shdc';
  const B16 = 1048576; // 16^5: category multiplier in a hand value
  const PAIRV = B16;    // smallest value that is a pair or better (dealer qualifies)

  // ── Hand values ──────────────────────────────────────────────────────────
  // value = cat*16^5 + five 4-bit kickers. cat: 0 high card … 8 straight flush.
  // Payout category ("pcat") is the same but 9 = royal flush.
  function mkVal(cat, k) { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (k[i] || 0); return v; }
  function straightTop(mask) {
    for (let t = 12; t >= 4; t--) if (((mask >> (t - 4)) & 31) === 31) return t;
    return (mask & 0x100F) === 0x100F ? 3 : -1; // wheel A-2-3-4-5
  }
  function evalRanks(cnt) { // non-flush value of a rank multiset (5–7 cards)
    let mask = 0, quad = -1; const trips = [], pairs = [], singles = [];
    for (let r = 12; r >= 0; r--) {
      const c = cnt[r]; if (!c) continue; mask |= 1 << r;
      if (c === 4) quad = r; else if (c === 3) trips.push(r); else if (c === 2) pairs.push(r); else singles.push(r);
    }
    if (quad >= 0) { let k = -1; for (let r = 12; r >= 0; r--) if (r !== quad && cnt[r]) { k = r; break; } return mkVal(7, [quad, k]); }
    if (trips.length && (trips.length > 1 || pairs.length)) return mkVal(6, [trips[0], Math.max(trips[1] ?? -1, pairs[0] ?? -1)]);
    const st = straightTop(mask); if (st >= 0) return mkVal(4, [st]);
    if (trips.length) return mkVal(3, [trips[0], ...singles.slice(0, 2)]);
    if (pairs.length >= 2) return mkVal(2, [pairs[0], pairs[1], Math.max(pairs[2] ?? -1, singles[0] ?? -1)]);
    if (pairs.length === 1) return mkVal(1, [pairs[0], ...singles.slice(0, 3)]);
    return mkVal(0, singles.slice(0, 5));
  }
  const popcnt = x => { let n = 0; while (x) { x &= x - 1; n++; } return n; };
  const FLUSH = new Int32Array(8192); // best flush/straight-flush value of a suited rank mask (0 if < 5 cards)
  for (let m = 0; m < 8192; m++) {
    if (popcnt(m) < 5) continue;
    const st = straightTop(m);
    if (st >= 0) { FLUSH[m] = mkVal(8, [st]); continue; }
    const k = []; for (let r = 12; r >= 0 && k.length < 5; r--) if (m >> r & 1) k.push(r);
    FLUSH[m] = mkVal(5, k);
  }
  function pcatOf(v) { const c = Math.floor(v / B16); return c === 8 && Math.floor(v / 65536) % 16 === 12 ? 9 : c; }

  // Rank table: every 5-card board rank multiset × every two extra ranks → non-flush value.
  const BKEY = new Int32Array(371293).fill(-1); // sorted 5 ranks (base 13) → board multiset index
  let nb = 0; const boardRanks = [];
  for (let a = 0; a < 13; a++) for (let b = a; b < 13; b++) for (let c = b; c < 13; c++) for (let d = c; d < 13; d++) for (let e = d; e < 13; e++) {
    if (a === e) continue; // five of a rank
    BKEY[(((a * 13 + b) * 13 + c) * 13 + d) * 13 + e] = nb++; boardRanks.push([a, b, c, d, e]);
  }
  const TAB = new Int32Array(nb * 169).fill(-1);
  { const cnt = new Int8Array(13);
    for (let i = 0; i < nb; i++) {
      cnt.fill(0); for (const r of boardRanks[i]) cnt[r]++;
      for (let x = 0; x < 13; x++) for (let y = x; y < 13; y++) {
        cnt[x]++; cnt[y]++;
        if (cnt[x] <= 4 && cnt[y] <= 4) TAB[i * 169 + x * 13 + y] = TAB[i * 169 + y * 13 + x] = evalRanks(cnt);
        cnt[x]--; cnt[y]--;
      }
    }
  }
  // Full 7-card evaluator (testing / simple paths)
  function eval7(cards) {
    const cnt = new Int8Array(13), sm = [0, 0, 0, 0];
    for (const c of cards) { cnt[c >> 2]++; sm[c & 3] |= 1 << (c >> 2); }
    let v = evalRanks(cnt);
    for (const m of sm) if (FLUSH[m] > v) v = FLUSH[m];
    return v;
  }

  // Binomials for colex ranking
  const BIN = []; for (let n = 0; n <= 52; n++) { BIN[n] = new Float64Array(7); for (let k = 0; k <= 6; k++) BIN[n][k] = k === 0 ? 1 : n < k ? 0 : (n === k ? 1 : 0); }
  for (let n = 1; n <= 52; n++) for (let k = 1; k <= 6; k++) BIN[n][k] = BIN[n - 1][k - 1] + BIN[n - 1][k];
  const binom = (n, k) => (n < 0 || k < 0 || n < k) ? 0 : BIN[n][k];

  // ── Phase 1: board stats ─────────────────────────────────────────────────
  // spec: { hole:[c,c], board:[known board cards], dealer:[0..1 known dealer cards], dead:[…] }

// ── Config / KV ───────────────────────────────────────────────────────────
let CFG = { cf_worker_url: '', kv_prefix: 'uth/' };

// ── State (settings persist; cards don't) ─────────────────────────────────

// The board is always five slots. Preflop uses the first (a flop card you've seen), the flop

// ── Money ─────────────────────────────────────────────────────────────────

// ── Inputs ────────────────────────────────────────────────────────────────
function cardHTML(c, extra = '') {

  const s = E.SUITS[c & 3];

}
function renderSlots() {
  const el = document.getElementById('slots');

    let cards = g.arr.map((c, i) => {

    <div class="kp-suits">${[0, 1, 2, 3].map(s => `<button class="kp ${E.SUITS[s]}" data-s="${s}" ${S.kpRank === null || used.has(S.kpRank * 4 + s) ? 'disabled' : ''}>${SUIT_SYM[E.SUITS[s]]}</button>`).join('')}</div>`;

  const mobile = matchMedia('(max-width: 860px)').matches;

}
function groupArr(id) { return S[id]; }
function addCard(c) {
  const gid = S.active, arr = groupArr(gid), g = groups().find(x => x.id === gid);
  if (gid === 'dead') { if (arr.length >= 12) return; arr.push(c); }
  else {
    const i = arr.findIndex((x, k) => x === null && k < g.limit);
    if (i < 0) return;
    arr[i] = c;
    if (!arr.slice(0, g.limit).includes(null)) { // group full → move on to the next group still missing a required card

function removeCard(gid, i) { const arr = groupArr(gid); if (gid === 'dead') arr.splice(i, 1); else arr[i] = null; S.active = gid; render(); onCardsChanged(); }

function renderOpts() {

function renderSetSum() {

// ── Worker pool (priority queue) ──────────────────────────────────────────
const NW = Math.max(1, Math.min(8, navigator.hardwareConcurrency || 4));
const pool = { workers: [], idle: [], queue: [], seq: 0 };
function initWorkers() {
  const src = document.getElementById('engine-src').textContent + `
    const actionsOnly = r => ({ actions: Object.fromEntries(Object.entries(r.actions).map(([k, a]) => [k, a.total])) });
    self.onmessage = (e) => {
      const m = e.data, E = self.HoldemEngine;
      try {
        if (m.type === 'stats') {
          const ctx = E.setup(m.spec), p = E.boardStats(m.spec, ctx, m.from, m.to);
          self.postMessage({ id: m.id, part: p }, [p.W.buffer, p.L.buffer, p.Wq.buffer, p.Lq.buffer, p.cat.buffer]);
        } else if (m.type === 'decide') {
          const ctx = E.setup(m.spec), r = E.decide(m.spec, ctx, m.st, m.game, m.opts);
          delete r.flopEVs;
          self.postMessage({ id: m.id, res: r });
        } else { // whole solve on one worker (impact steps, range chart)
          const ctx = E.setup(m.spec), st = E.boardStats(m.spec, ctx);
          const r = (m.spec.street || 'preflop') === 'preflop' ? E.decideTotals(m.spec, ctx, st, m.game, m.opts) : actionsOnly(E.decide(m.spec, ctx, st, m.game, m.opts));
          self.postMessage({ id: m.id, res: r });
        }
      } catch (err) { self.postMessage({ id: m.id, error: err.message }); }
    };`;
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  for (let i = 0; i < NW; i++) {
    const w = new Worker(url);
    w.onmessage = e => { const j = w.job; w.job = null; pool.idle.push(w); e.data.error ? j.reject(new Error(e.data.error)) : j.resolve(e.data); dispatch(); };
    pool.workers.push(w); pool.idle.push(w);
  }
}
function dispatch() {
  while (pool.idle.length && pool.queue.length) {
    pool.queue.sort((a, b) => b.prio - a.prio || a.n - b.n);
    const j = pool.queue.shift();
    if (j.stale && j.stale()) { j.reject(new Error('stale')); continue; }
    const w = pool.idle.pop(); w.job = j;
    w.postMessage({ ...j.msg, id: j.n }, j.transfer || []);
  }
}
function runJob(msg, { prio = 0, transfer, stale } = {}) {
  return new Promise((resolve, reject) => { pool.queue.push({ msg, prio, transfer, stale, resolve, reject, n: ++pool.seq }); dispatch(); });
}

// ── Solving the current hand ──────────────────────────────────────────────
function currentSpec() {
  return { hole: S.hole.slice(), board: boardSlots().filter(c => c !== null), dealer: S.dealer.filter(c => c !== null), dead: S.dead.slice(), street: S.street };
}
function specReady(sp) {
  if (sp.hole.some(c => c === null)) return 'Pick your two cards';
  if (S.street === 'flop' && sp.board.length !== 3) return 'Pick the three flop cards';
  if (S.street === 'river' && sp.board.length !== 5) return 'Pick all five board cards';
  return null;
}
const gameOpts = () => S.game === 'uth' ? { trips: S.tables.uthTrips } : { badBeat: S.tables.badBeat, trips: S.tables.wptTrips, pocket: S.tables.pocket };
const variantKey = () => S.game === 'uth' ? 'uth' : 'wpt-' + S.tables.badBeat.toLowerCase();
// Canonical form: suits relabelled to the smallest equivalent (A♠K♠ ≡ A♥K♥), so equal situations share a key.
const PERMS = (() => { const out = []; const rec = (p, rest) => { if (!rest.length) { out.push(p); return; } rest.forEach((x, i) => rec([...p, x], rest.filter((_, k) => k !== i))); }; rec([], [0, 1, 2, 3]); return out; })();
function canonKey(sp) {
  let best = null;
  for (const pm of PERMS) {
    const m = c => (c >> 2) * 4 + pm[c & 3];
    const part = a => a.map(m).sort((x, y) => y - x).map(E.cardStr).join('');
    const k = [part(sp.hole), part(sp.board), part(sp.dealer), part(sp.dead)].join('_');
    if (best === null || k < best) best = k;
  }
  return best.toLowerCase();
}

let RES = null;               // { sp, res, cached, impact: [...] }
let statsCache = { key: null, st: null };
let solveTimer = null, solveSeq = 0;
function scheduleSolve() { clearTimeout(solveTimer); solveTimer = setTimeout(solve, 120); }
function onCardsChanged() { scheduleSolve(); scheduleChart(); }
function onRulesChanged() { scheduleSolve(); scheduleChart(); }

async function solve() {
  const seq = ++solveSeq;
  const sp = currentSpec(), notReady = specReady(sp);
  if (notReady) { RES = { notReady }; renderResults(); return; }
  const ctx = E.setup(sp), heavy = ctx.nBoards > 300000;
  RES = { busy: true, sp, msg: `${ctx.nBoards.toLocaleString()} boards × ${ctx.nDealer} dealer hands` };
  renderResults();
  const t0 = performance.now();
  const kvKey = `${ENGINE_VERSION}/${variantKey()}/${sp.street}-${canonKey(sp).replace(/[^a-z0-9_-]/g, '')}.json`;
  let res = heavy ? await kvGet(kvKey) : null, cached = !!res;
  if (seq !== solveSeq) return;
  if (!res) {
    try {
      let st;
      const exact = JSON.stringify(sp); // stats arrays belong to the exact cards, not the canonical form
      if (statsCache.key === exact) st = statsCache.st;
      else {
        const parts = E.splitWork(ctx, ctx.nBoards > 50000 ? NW : 1);
        let done = 0;
        const got = await Promise.all(parts.map(([a, b]) => runJob({ type: 'stats', spec: sp, from: a, to: b }, { prio: 3 }).then(r => {
          done++; const p = document.getElementById('prog'); if (p && seq === solveSeq) p.style.width = (done / parts.length * 85) + '%'; return r.part; })));
        if (seq !== solveSeq) return;
        st = E.mergeStats(ctx, got);
        statsCache = { key: exact, st };
      }
      const m = document.getElementById('solveMsg'); if (m) m.textContent = 'Working out the best play on every flop and river…';
      const copy = { W: st.W.slice(), L: st.L.slice(), Wq: st.Wq.slice(), Lq: st.Lq.slice(), cat: st.cat.slice() };
      const r = await runJob({ type: 'decide', spec: sp, st: copy, game: S.game, opts: gameOpts() }, { prio: 3, transfer: [copy.W.buffer, copy.L.buffer, copy.Wq.buffer, copy.Lq.buffer, copy.cat.buffer] });
      res = r.res;
      res.ms = Math.round(performance.now() - t0);
      if (heavy && res.ms > 1500) kvPut(kvKey, res).then(ok => ok && setKvStatus('Saved this result to the shared cache'));
    } catch (e) {
      if (seq === solveSeq) { RES = { error: e.message }; renderResults(); }
      return;
    }
  }
  if (seq !== solveSeq) return;
  RES = { sp, res, cached, impact: null };
  renderResults();
  computeImpact(seq, sp, res);
  if (matchMedia('(max-width: 860px)').matches && !RES.seenOnce) { /* the bar shows the verdict; the sheet opens on tap */ }
}

// ── Impact of each known card: no info → +flop card → +dealer → +others ──
function maxBetKey(acts) { // largest allowed bet at this street
  const bets = Object.keys(acts).filter(k => /^bet\d$/.test(k) && allowedAction(k)).sort((a, b) => +b.slice(3) - +a.slice(3));
  return bets[0];
}
function allowedAction(k) { return !(S.game === 'wpt' && S.street === 'preflop' && /^bet[12]$/.test(k) && !S.wptRaises[k.slice(3)]); }
const totalOf = a => typeof a === 'number' ? a : a.total;
function summarize(acts) { // acts: {bet4: total|{total}, check: …}
  const keys = Object.keys(acts).filter(allowedAction);
  const best = keys.reduce((a, k) => !a || totalOf(acts[k]) > totalOf(acts[a]) ? k : a, null);
  const mb = maxBetKey(acts), passive = acts.check !== undefined ? 'check' : 'fold';
  return { best, ev: totalOf(acts[best]), margin: totalOf(acts[mb]) - totalOf(acts[passive]), mb, passive };
}

  return a === b ? R[a] + R[b] : R[a] + R[b] + ((hole[0] & 3) === (hole[1] & 3) ? 's' : 'o');
}
async function computeImpact(seq, sp, res) {
  const steps = [];
  const base = { hole: sp.hole, board: S.street === 'preflop' ? [] : sp.board, dealer: [], dead: [], street: sp.street };
  steps.push({ label: S.street === 'preflop' ? 'No extra cards' : 'Just your hand and the board', spec: base });
  let cur = base;
  if (S.street === 'preflop' && sp.board.length) { cur = { ...cur, board: sp.board }; steps.push({ label: `+ flop card ${cardTxt(sp.board[0])}`, spec: cur }); }
  if (sp.dealer.length) { cur = { ...cur, dealer: sp.dealer }; steps.push({ label: `+ dealer card ${cardTxt(sp.dealer[0])}`, spec: cur }); }
  if (sp.dead.length) { cur = { ...cur, dead: sp.dead }; steps.push({ label: `+ ${sp.dead.length} other player card${sp.dead.length === 1 ? '' : 's'}`, spec: cur }); }
  if (steps.length < 2) { RES.impact = []; renderResults(); return; }
  steps[steps.length - 1].acts = res.actions;
  // no-info preflop step comes from the shipped baselines when available
  if (S.street === 'preflop' && BASE) { const b = BASE[handClass(sp.hole)]?.games[S.game === 'uth' ? 'uth' : 'wpt:' + S.tables.badBeat]; if (b) steps[0].acts = b.actions; }
  RES.impact = steps; renderResults();
  await Promise.all(steps.filter(s => !s.acts).map(s => runJob({ type: 'solve', spec: s.spec, game: S.game, opts: gameOpts() }, { prio: 2, stale: () => seq !== solveSeq })
    .then(r => { if (seq === solveSeq) { s.acts = r.res.actions; renderResults(); } }).catch(() => {})));
}

// ── Rendering: results ────────────────────────────────────────────────────
const ACT_LABEL = { bet4: 'Bet 4x', bet3: 'Bet 3x', bet2: 'Bet 2x', bet1: 'Bet 1x', check: 'Check', fold: 'Fold' };
function sideBetEV(res) {
  const t = S.game === 'uth' ? E.GAMES.uth.trips[S.tables.uthTrips] : E.GAMES.wpt.trips[S.tables.wptTrips];
  return res.catHist.reduce((s, p, c) => s + p * t[c], 0);
}
function renderResults() {
  const el = document.getElementById('tabHand');
  renderMbar();
  if (!RES || RES.notReady) { el.innerHTML = `<div class="empty"><div class="big">${RES?.notReady || 'Pick your two cards'}</div>Results appear as soon as the hand is complete.</div>`; return; }
  if (RES.error) { el.innerHTML = `<div class="empty"><div class="big">Something went wrong</div>${RES.error}</div>`; return; }
  if (RES.busy) { el.innerHTML = `<div class="empty"><div class="big">Counting every deal…</div><span id="solveMsg">${RES.msg}</span><div class="progress"><span id="prog"></span></div></div>`; return; }
  const { sp, res, cached } = RES, A = res.actions;
  const acts = Object.keys(A).filter(allowedAction).sort((a, b) => A[b].total - A[a].total);
  const sm = summarize(A), best = sm.best, g = E.GAMES[S.game];
  const second = acts[1];
  const closeCall = Math.abs(A[best].total - A[second].total) < 0.02;

  let h = `<div class="verdict"><div class="act ${best.startsWith('bet') ? 'bet' : best}">${ACT_LABEL[best]}</div>
    <div class="why">${best.startsWith('bet')
      ? `Beats ${sm.passive}ing by <b>${money(sm.margin).replace('+', '')}</b>${unitWord()}`
      : `${ACT_LABEL[sm.mb]} would cost <b>${money(-sm.margin).replace('+', '')}</b>${unitWord()} more than ${sm.passive}ing`}
      · EV <b>${money(A[best].total)}</b>${closeCall ? ' · <span class="close">close call</span>' : ''}</div></div>`;

// ── Range chart ───────────────────────────────────────────────────────────
// The best play for every starting hand, given what you've seen. Follows the street:
// preflop → bet vs check, flop (3 board cards) → bet 2x vs check, river (5) → bet 1x vs fold.
// Each hand class is split into its suit combos; combos that are the same situation up to
// relabelling suits are solved once. Combos that use a known card are left out.
const CLASSES = (() => {
  const out = [];
  for (let i = 12; i >= 0; i--) for (let j = 12; j >= 0; j--) {
    const hi = Math.max(i, j), lo = Math.min(i, j), R = E.RANKS;
    const key = i === j ? R[i] + R[j] : i > j ? R[hi] + R[lo] + 's' : R[hi] + R[lo] + 'o'; // above the diagonal = suited
    const combos = [];

      combos.push([hi * 4 + a, lo * 4 + b]);

})();
const knownForChart = () => ({ street: S.street, board: boardSlots().filter(c => c !== null), dealer: S.dealer.filter(c => c !== null), dead: S.dead.slice() });

  'wpt-bb-3': { game: 'wpt', opts: { badBeat: 'BB-3' } }, 'wpt-bb-4': { game: 'wpt', opts: { badBeat: 'BB-4' } } };

let CH = null;              // { key, street, data: {cls: [{w, a:{bet4: total, …}}]}, base, done, total, startedAt, complete }
let chartTimer = null, chartSeq = 0;

// Solve every hand for one set of known cards. Returns { cls: [{ w, a: { action: EV } }] }.
async function computeChart(kn, variant, { prio = 1, stale, onProgress } = {}) {

// Per class: weighted share of suit combos that should bet, the mean margin (max bet − check/fold),

// ── Pre-seeding the shared cache (browser console) ────────────────────────
// seedCache()                                  → common preflop charts for the selected game
// seedCache({ kinds: ['dealer', 'flop', 'flop+dealer'], variants: ['uth', 'wpt-bb-1'] })
// seedCache({ kinds: ['dead1', 'dead2'] })     → charts for 1 or 2 seen player cards (dead2 is an overnight job)

// seedCache.list()  → what would be done      seedCache.stop() → stop after the current chart

function seedScenarios(kinds) {

  const card = (r, s) => r * 4 + s;

    if (kind === 'dealer') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [], dealer: [card(r, 0)], dead: [] });
    if (kind === 'flop') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [card(r, 0)], dealer: [], dead: [] });
    if (kind === 'flop+dealer') for (let r1 = 12; r1 >= 0; r1--) for (let r2 = 12; r2 >= 0; r2--) for (const ss of [0, 1]) {
      if (r1 === r2 && ss === 0) continue; // same rank → must be different suits
      add({ street: 'preflop', board: [card(r1, 0)], dealer: [card(r2, ss)], dead: [] });
    }
    // other players' cards (nothing else known): 13 single cards, 169 pairs (same suit / different suit / paired)
    if (kind === 'dead1') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [], dealer: [], dead: [card(r, 0)] });

async function seedCache({ kinds = ['dealer', 'flop', 'flop+dealer'], variants = [variantKey()], part = [1, 1] } = {}) {

  seedStop = false;

function setTab(t) {
  S.tab = t; saveSettings();
  document.querySelectorAll('#tabSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.getElementById('tabHand').style.display = t === 'hand' ? '' : 'none';
  document.getElementById('tabChart').style.display = t === 'chart' ? '' : 'none';
  if (t === 'chart') { if (!CH || CH.pendingTab) buildChart(); else renderChart(); }
  renderMbar();
}
function setGame(g) {
  S.game = g; saveSettings();
  document.querySelectorAll('#gameSeg button').forEach(x => x.classList.toggle('on', x.dataset.g === g));
  renderOpts(); onRulesChanged();
}
function setStreet(s) {
  S.street = s; saveSettings();
  document.querySelectorAll('#streetSeg button').forEach(x => x.classList.toggle('on', x.dataset.s === s));
  if (s !== 'preflop' && S.hole.every(c => c !== null)) S.active = 'board';
  render(); scheduleSolve(); scheduleChart();
}
function openSheet(open) { document.getElementById('pane').classList.toggle('open', open); document.body.classList.toggle('sheet-open', open); }
function renderToken() {
  const el = document.getElementById('tokenArea');
  el.innerHTML = writeToken
    ? `Write token saved — slow results are shared to the cache <button id="tokOut">Forget</button>`
    : `<input id="tokIn" type="password" placeholder="Write token (optional)"> <button id="tokSave">Save</button>`;
  document.getElementById('tokOut')?.addEventListener('click', () => { writeToken = ''; try { localStorage.removeItem('writeToken'); } catch (_) {} renderToken(); });
  document.getElementById('tokSave')?.addEventListener('click', () => { writeToken = document.getElementById('tokIn').value.trim(); try { localStorage.setItem('writeToken', writeToken); } catch (_) {} renderToken(); });
}
document.querySelectorAll('#gameSeg button').forEach(b => b.onclick = () => setGame(b.dataset.g));
document.querySelectorAll('#streetSeg button').forEach(b => b.onclick = () => setStreet(b.dataset.s));
document.querySelectorAll('#tabSeg button').forEach(b => b.onclick = () => setTab(b.dataset.t));
document.getElementById('mbar').onclick = () => openSheet(true);
document.getElementById('sheetClose').onclick = () => openSheet(false);
document.getElementById('clearAll').onclick = () => { S.hole = [null, null]; S.board = [null, null, null, null, null]; S.dealer = [null]; S.dead = []; S.active = 'hole'; render(); onCardsChanged(); };

(async () => {
  initWorkers();
  document.querySelectorAll('#gameSeg button').forEach(x => x.classList.toggle('on', x.dataset.g === S.game));
  document.querySelectorAll('#streetSeg button').forEach(x => x.classList.toggle('on', x.dataset.s === S.street));
  renderOpts(); render(); renderToken(); renderResults(); setTab(S.tab);
  try { const c = await fetch('config.json?t=' + Date.now()); if (c.ok) Object.assign(CFG, await c.json()); } catch (_) {}
  if (CFG.kv_prefix && !CFG.kv_prefix.endsWith('/')) CFG.kv_prefix += '/';
  setKvStatus(workerBase() ? `Shared cache: ${CFG.kv_prefix}` : 'Shared cache: off (no config.json)');
  try { const b = await fetch('baselines.json'); if (b.ok) BASE = await b.json(); } catch (_) {}
  CH = null; buildChart();
})();
</script>
</body>
</html>
