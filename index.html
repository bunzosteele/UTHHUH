<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1a14">
<title>Hold'em EV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #0d2a1f; --felt-2: #11352a; --felt-deep: #081b14;
    --ink: #eef3ee; --dim: #9db3a7; --faint: #6b8a7c; --line: #24473a;
    --gold: #e6c06a; --gold-dim: #a8873f;
    --good: #57d68d; --bad: #ff7a6e; --warn: #f2c35b;
    --raise: #d9473f; --check: #3a4a44;
    --card: #fbfaf6; --card-line: #d6d2c6;
    --s: #1d1d1f; --h: #d8343b; --d: #2563c9; --c: #1f8a4c;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --serif: 'Fraunces', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--felt-deep); min-height: 100%; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 15px; line-height: 1.45; min-height: 100vh;
    background: radial-gradient(ellipse 90% 520px at 50% -10%, #17463a 0%, transparent 70%), linear-gradient(180deg, var(--felt) 0%, var(--felt-deep) 700px);
  }
  button { font-family: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: 32px; letter-spacing: -0.01em; line-height: 1; }
  h1 span { color: var(--gold); }
  .seg { display: inline-flex; background: var(--felt-deep); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { background: none; border: 0; color: var(--dim); font-weight: 600; font-size: 14px; padding: 7px 13px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--gold); color: #1c1606; }
  .seg button:not(.on):hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  .panel { background: rgba(8, 27, 20, 0.72); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .ptitle { font-family: var(--serif); font-weight: 600; font-size: 17px; display: flex; align-items: baseline; gap: 10px; }
  .ptitle small { font-family: 'IBM Plex Sans'; font-size: 13px; color: var(--faint); font-weight: 400; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

  /* Slots */
  .slots { display: flex; flex-wrap: wrap; gap: 10px; }
  .slotgroup { flex: 1 1 auto; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; transition: border-color .15s, background .15s; min-width: 0; }
  .slotgroup.wide { flex-basis: 100%; }
  .slotgroup:hover { border-color: #3a6b58; }
  .slotgroup.active { border-color: var(--gold); background: rgba(230, 192, 106, 0.06); }
  .slothead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; white-space: nowrap; }
  .slothead b { font-weight: 600; font-size: 13px; }
  .slothead span { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
  .slotcards { display: flex; flex-wrap: wrap; gap: 6px; min-height: 56px; align-items: center; }
  .clear { background: none; border: 0; color: var(--faint); font-size: 12px; cursor: pointer; padding: 0 2px; }
  .clear:hover { color: var(--bad); }

  .pc { width: 40px; height: 56px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-line); display: flex; flex-direction: column; align-items: center; justify-content: center;
        font: 600 18px var(--mono); line-height: 1; box-shadow: 0 2px 0 rgba(0,0,0,.25); position: relative; cursor: pointer; flex: none; }
  .pc i { font-style: normal; font-size: 16px; margin-top: 2px; }
  .ts { color: #e3e9e5; } .th { color: #ff7d7d; } .td { color: #74adff; } .tc { color: #5fd38f; }
  .s { color: var(--s); } .h { color: var(--h); } .d { color: var(--d); } .c { color: var(--c); }
  .pc.empty { background: transparent; border: 1.5px dashed #3a6b58; box-shadow: none; color: var(--faint); }
  .pc .x { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #2a1414; color: #ffb3ab; font-size: 10px; display: none; align-items: center; justify-content: center; }
  .pc:hover .x { display: flex; }
  .pc.off { opacity: 0.28; }
  .pc.empty.off { border-style: dotted; }
  .slotcards .gap { width: 8px; flex: none; }

  /* Desktop picker: the whole deck */
  .picker { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
  .pk { aspect-ratio: 5 / 7; border-radius: 5px; background: var(--card); border: 1px solid var(--card-line); font: 600 14px var(--mono); display: flex; flex-direction: column;
        align-items: center; justify-content: center; line-height: 1; cursor: pointer; user-select: none; transition: transform .08s; }
  .pk i { font-style: normal; font-size: 12px; }
  .pk:hover { transform: translateY(-2px); }
  .pk.used { opacity: 0.16; cursor: default; transform: none; }
  /* Mobile picker: rank then suit */
  .keypad { display: none; margin-top: 14px; }
  .kp-ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .kp-suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .kp { height: 46px; border-radius: 9px; border: 1px solid var(--line); background: var(--felt-2); color: var(--ink); font: 600 18px var(--mono); cursor: pointer; }
  .kp.on { background: var(--gold); color: #1c1606; border-color: var(--gold); }
  .kp:disabled { opacity: 0.25; cursor: default; }
  .kp-suits .kp { background: var(--card); border-color: var(--card-line); font-size: 24px; height: 50px; }
  .kp-suits .kp:disabled { opacity: 0.45; }
  .kp-suits .kp.s { color: var(--s); } .kp-suits .kp.h { color: var(--h); } .kp-suits .kp.d { color: var(--d); } .kp-suits .kp.c { color: var(--c); }
  .kp-suits .kp { font-size: 28px; line-height: 1; }
  .pickhint { font-size: 13px; color: var(--dim); margin-top: 10px; }
  .pickhint b { color: var(--gold); font-weight: 600; }

  /* Results pane */
  .pane .tabs { margin-bottom: 14px; }
  .sheet-head { display: none; }
  .verdict { border-radius: 12px; padding: 14px 16px; background: linear-gradient(135deg, rgba(230,192,106,0.14), rgba(230,192,106,0.03)); border: 1px solid rgba(230,192,106,0.45); }
  .verdict .act { font-family: var(--serif); font-size: 30px; font-weight: 800; line-height: 1.05; }
  .act.bet, .chip.bet { color: var(--good); } .act.check, .chip.check { color: var(--warn); } .act.fold, .chip.fold { color: var(--bad); }
  .verdict .why { margin-top: 6px; color: var(--dim); font-size: 14px; }
  .verdict .why b, .mono { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .close { color: var(--warn); }
  .flip { color: var(--gold); font-weight: 600; }
  .explain { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--dim); }
  .explain .k { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .explain p { margin: 0 0 6px; } .explain p:last-child { margin: 0; }
  .explain b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .explain ul { margin: 6px 0 0; padding-left: 18px; } .explain li { margin-bottom: 4px; }
  .explain p > b:first-child, .explain li > b:first-child { font-family: inherit; }

  h3 { font-family: var(--serif); font-weight: 600; font-size: 15px; margin: 18px 0 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  th { text-align: right; font-weight: 500; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 8px; text-align: right; border-bottom: 1px solid rgba(36,71,58,0.5); font-family: var(--mono); font-weight: 500; white-space: nowrap; }
  td:first-child { font-family: 'IBM Plex Sans'; font-weight: 600; white-space: normal; }
  tr.best td { background: rgba(87,214,141,0.08); }
  tr.best td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  td.tot { font-weight: 600; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .zero { color: var(--dim); }
  .chip { font-family: 'IBM Plex Sans'; font-weight: 600; }
  .impact td:first-child .mini { font-family: var(--mono); font-weight: 600; }
  .pending { color: var(--faint); font-style: italic; font-family: 'IBM Plex Sans'; font-weight: 400; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .v { font-family: var(--mono); font-size: 14px; margin-top: 3px; }
  .bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin-top: 7px; background: var(--line); }
  .bar span { display: block; height: 100%; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--dim); font-size: 14px; }
  summary:hover { color: var(--ink); }
  .note { font-size: 12.5px; color: var(--faint); margin-top: 8px; }
  .progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
  .empty { color: var(--dim); text-align: center; padding: 36px 10px; }
  .empty .big { font-family: var(--serif); font-size: 21px; color: var(--ink); margin-bottom: 6px; }

  /* Range chart */
  .chart-head { font-size: 14px; color: var(--dim); margin-bottom: 10px; }
  .chart-head b { color: var(--ink); }
  .rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; background: #0a1611; border-radius: 8px; padding: 3px; }
  .rc { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: #fff; border-radius: 3px; cursor: pointer; position: relative; user-select: none; }
  .rc { text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .rc.wait { background: #1b2b25 !important; color: var(--faint); text-shadow: none; }
  .rc.blocked { background: #0f1a16; color: #33473f; cursor: default; text-shadow: none; }
  .legend small { color: var(--faint); font-size: 12px; }
  .rc.chg::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--gold); border-radius: 3px; }
  .rc.sel { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; }
  .rc .bdg { position: absolute; right: -3px; bottom: -3px; z-index: 2; font: 700 12px/1 var(--mono); color: #fff; padding: 2px 3px; border-radius: 4px; letter-spacing: -0.03em; box-shadow: 0 0 0 1.5px #0a1611; }
  .legend .lg-b { position: relative; width: 18px !important; height: 18px !important; }
  .legend .lg-b b { position: absolute; right: -4px; bottom: -4px; font: 700 11px/1 var(--mono); color: #fff; padding: 1px 2px; border-radius: 3px; }
  .cinfo { margin-top: 12px; border: 1px solid var(--gold-dim); border-radius: 10px; padding: 10px 12px; background: rgba(230,192,106,0.05); }
  .cinfo-h { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--dim); }
  .cinfo-h b { color: var(--ink); font-family: var(--mono); }
  .cinfo-h .clear { margin-left: auto; }
  .cinfo td:first-child { white-space: normal; }
  .combo { background: var(--felt-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin: 2px 2px 2px 0; font: 600 13px var(--mono); cursor: pointer; }
  .combo:hover { border-color: var(--gold-dim); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--dim); align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
  .chart-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--dim); cursor: pointer; }
  .chk input { accent-color: var(--gold); }

  /* Settings */
  .settings { margin-top: 18px; }
  .settings > summary { list-style: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .settings > summary::-webkit-details-marker { display: none; }
  .settings > summary::before { content: '⚙'; color: var(--gold); }
  .settings > summary .ptitle { display: inline; }
  .settings > summary .sum { color: var(--faint); font-size: 13px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .opt label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .opt .chk { text-transform: none; letter-spacing: 0; font-size: 14px; margin-right: 10px; display: inline-flex; }
  select, .money { width: 100%; background: var(--felt-deep); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: 500 14px 'IBM Plex Sans'; }
  .money { font-family: var(--mono); }
  footer { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--faint); }
  footer input { background: var(--felt-deep); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 6px 9px; font: 14px 'IBM Plex Sans'; }
  footer button { background: var(--felt-2); border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

  .mbar { display: none; }

  /* Quiz */
  .quiz { display: none; }
  body.quiz-mode .quiz { display: block; }
  body.quiz-mode .layout, body.quiz-mode .mbar { display: none !important; }
  .qbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .qopts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .qlbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .qscore { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--dim); }
  .qscore b { font-family: var(--mono); color: var(--ink); font-size: 15px; }
  .qscore .clear { margin-left: 4px; }
  .qhead { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .qhead small { font-family: 'IBM Plex Sans'; font-size: 14px; color: var(--faint); font-weight: 400; margin-left: 8px; }
  .qtable { display: flex; flex-wrap: wrap; gap: 14px 26px; margin: 16px 0 6px; }
  .qgroup .k { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .qgroup .cards { display: flex; gap: 6px; align-items: center; }
  .qgroup .pc { cursor: default; width: 46px; height: 64px; font-size: 20px; }
  .qgroup .pc .x { display: none !important; }
  .qgroup .pc.hidden { background: repeating-linear-gradient(45deg, #1c3a2f 0 6px, #17322a 6px 12px); border-color: #2c5545; box-shadow: none; }
  .qprompt { margin: 18px 0 10px; color: var(--dim); }
  .qacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .qact { padding: 16px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--felt-2); color: var(--ink); font: 700 18px var(--serif); cursor: pointer; transition: transform .08s, border-color .15s; }
  .qact:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .qact small { display: block; font: 500 12px 'IBM Plex Sans'; color: var(--faint); margin-top: 3px; }
  .qact:disabled { cursor: default; }
  .qhelp { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .qpath { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; color: var(--dim); font-size: 14px; }
  .qpath b { color: var(--ink); }
  table.qgrade { margin-top: 12px; }
  table.qgrade td { vertical-align: middle; }
  table.qgrade tr.qevs td { padding-top: 0; font-size: 12px; color: var(--faint); border-top: none; }
  table.qgrade tr.qevs td b { font-family: var(--mono); color: var(--dim); font-weight: 500; }
  .qtough { font-size: 11px; color: var(--gold); border: 1px solid var(--gold-dim); border-radius: 6px; padding: 1px 5px; margin-left: 4px; white-space: nowrap; }
  .resetbtn { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--bad); background: rgba(255,122,110,0.08); color: var(--bad); font-weight: 600; cursor: pointer; }
  .linkbtn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
  .qact.right { border-color: var(--good); background: rgba(87,214,141,0.14); }
  .qact.wrong { border-color: var(--bad); background: rgba(255,122,110,0.12); }
  .qact.best { box-shadow: inset 0 0 0 2px var(--good); }
  .qres { margin-top: 16px; border-radius: 12px; padding: 14px 16px; border: 1px solid; }
  .qres.ok { border-color: rgba(87,214,141,0.6); background: rgba(87,214,141,0.07); }
  .qres.no { border-color: rgba(255,122,110,0.55); background: rgba(255,122,110,0.06); }
  .qres .big { font-family: var(--serif); font-size: 24px; font-weight: 800; }
  .qres.ok .big { color: var(--good); } .qres.no .big { color: var(--bad); }
  .qres .why { color: var(--dim); margin-top: 4px; }
  .qres .why b { color: var(--ink); font-family: var(--mono); }
  .qnext { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .qnext button { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt-2); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; }
  .qnext button.primary { background: var(--gold); color: #1c1606; border-color: var(--gold); }

  /* ── Mobile: one column; results become a bottom sheet ── */
  @media (max-width: 860px) {
    .wrap { padding: 16px 12px 96px; }
    h1 { font-size: 26px; }
    header { margin-bottom: 12px; }
    .layout { grid-template-columns: 1fr; }
    .panel { padding: 13px; }
    .picker { display: none; }
    .keypad { display: block; }
    .pc { width: 38px; height: 52px; font-size: 17px; }
    .slots { gap: 8px; }
    .slotgroup:not(.wide) { flex: 1 1 0; padding: 8px 9px; }
    .slotgroup:not(.wide) .slothead span { display: none; }
    .slotcards { min-height: 52px; }
    .pane { position: fixed; left: 0; right: 0; bottom: 0; top: 7vh; z-index: 50; border-radius: 18px 18px 0 0; overflow-y: auto; padding: 0 14px 30px;
            transform: translateY(105%); transition: transform .25s ease; background: #0b1f18; border: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
    .pane.open { transform: none; box-shadow: 0 -10px 40px rgba(0,0,0,.6); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #0b1f18; padding: 10px 0 10px; z-index: 2; }
    .sheet-head::before { content: ''; position: absolute; left: 50%; top: 5px; width: 40px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
    .sheet-close { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 5px 12px; font-size: 14px; }
    .pane .tabs { margin: 6px 0 12px; }
    .qgroup .pc { width: 40px; height: 56px; font-size: 18px; }
    .qhead { font-size: 19px; }
    .mbar { display: flex; position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40; align-items: center; gap: 12px;
            background: #0f2a20; border: 1px solid var(--gold-dim); border-radius: 14px; padding: 11px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.55); cursor: pointer; }
    .mbar .mact { font-family: var(--serif); font-weight: 800; font-size: 20px; }
    .mbar .mtxt { flex: 1; font-size: 13px; color: var(--dim); line-height: 1.3; min-width: 0; }
    .mbar .mtxt b { color: var(--ink); font-family: var(--mono); }
    .mbar .mopen { color: var(--gold); font-weight: 600; font-size: 14px; white-space: nowrap; }
    body.sheet-open { overflow: hidden; }
    .rc { font-size: 9px; }
    .rc .bdg { font-size: 10px; padding: 1px 2px; right: -2px; bottom: -2px; }
    td, th { padding: 7px 5px; }
  }
</style>
</head>

<script>
// A phone set to "Desktop site" ignores the viewport tag and lays the page out ~980px wide, so the
// two-column desktop view shows up shrunk. Spot that (layout wider than the screen's longest side)
// and apply the phone styles anyway, zoomed so text is a normal size.
(() => {

<script id="engine-src">
/*
 * Hold'em table-game EV engine (Ultimate Texas Hold'em, WPT Heads-Up Hold'em).
 *
 * Exact enumeration, not simulation. Two phases:
 *   1. Board stats (game-independent): for every possible completion of the board, count how the
 *      dealer's possible hands fare against ours: W/L (all dealer hands) and Wq/Lq (dealer
 *      qualifies), plus our hand's category. Rank-pair tables make this ~91 lookups per board
 *      instead of ~990 hand evaluations.
 *   2. Decisions (per game + paytable): walk river → flop → preflop, taking the better action at
 *      each node (backward induction), summing EVs per bet spot.
 *
 * Cards: id = rank*4 + suit, rank 0..12 = 2..A, suit 0..3 = s h d c.
 */
(function (root) {
  'use strict';
  const RANKS = '23456789TJQKA', SUITS = 'shdc';
  const B16 = 1048576; // 16^5: category multiplier in a hand value
  const PAIRV = B16;    // smallest value that is a pair or better (dealer qualifies)

  // ── Hand values ──────────────────────────────────────────────────────────
  // value = cat*16^5 + five 4-bit kickers. cat: 0 high card … 8 straight flush.
  // Payout category ("pcat") is the same but 9 = royal flush.
  function mkVal(cat, k) { let v = cat; for (let i = 0; i < 5; i++) v = v * 16 + (k[i] || 0); return v; }
  function straightTop(mask) {
    for (let t = 12; t >= 4; t--) if (((mask >> (t - 4)) & 31) === 31) return t;
    return (mask & 0x100F) === 0x100F ? 3 : -1; // wheel A-2-3-4-5
  }
  function evalRanks(cnt) { // non-flush value of a rank multiset (5–7 cards)
    let mask = 0, quad = -1; const trips = [], pairs = [], singles = [];
    for (let r = 12; r >= 0; r--) {
      const c = cnt[r]; if (!c) continue; mask |= 1 << r;
      if (c === 4) quad = r; else if (c === 3) trips.push(r); else if (c === 2) pairs.push(r); else singles.push(r);
    }
    if (quad >= 0) { let k = -1; for (let r = 12; r >= 0; r--) if (r !== quad && cnt[r]) { k = r; break; } return mkVal(7, [quad, k]); }
    if (trips.length && (trips.length > 1 || pairs.length)) return mkVal(6, [trips[0], Math.max(trips[1] ?? -1, pairs[0] ?? -1)]);
    const st = straightTop(mask); if (st >= 0) return mkVal(4, [st]);
    if (trips.length) return mkVal(3, [trips[0], ...singles.slice(0, 2)]);
    if (pairs.length >= 2) return mkVal(2, [pairs[0], pairs[1], Math.max(pairs[2] ?? -1, singles[0] ?? -1)]);
    if (pairs.length === 1) return mkVal(1, [pairs[0], ...singles.slice(0, 3)]);
    return mkVal(0, singles.slice(0, 5));
  }
  const popcnt = x => { let n = 0; while (x) { x &= x - 1; n++; } return n; };
  const FLUSH = new Int32Array(8192); // best flush/straight-flush value of a suited rank mask (0 if < 5 cards)
  for (let m = 0; m < 8192; m++) {
    if (popcnt(m) < 5) continue;
    const st = straightTop(m);
    if (st >= 0) { FLUSH[m] = mkVal(8, [st]); continue; }
    const k = []; for (let r = 12; r >= 0 && k.length < 5; r--) if (m >> r & 1) k.push(r);
    FLUSH[m] = mkVal(5, k);
  }
  function pcatOf(v) { const c = Math.floor(v / B16); return c === 8 && Math.floor(v / 65536) % 16 === 12 ? 9 : c; }

  // Rank table: every 5-card board rank multiset × every two extra ranks → non-flush value.
  const BKEY = new Int32Array(371293).fill(-1); // sorted 5 ranks (base 13) → board multiset index
  let nb = 0; const boardRanks = [];
  for (let a = 0; a < 13; a++) for (let b = a; b < 13; b++) for (let c = b; c < 13; c++) for (let d = c; d < 13; d++) for (let e = d; e < 13; e++) {
    if (a === e) continue; // five of a rank
    BKEY[(((a * 13 + b) * 13 + c) * 13 + d) * 13 + e] = nb++; boardRanks.push([a, b, c, d, e]);
  }
  const TAB = new Int32Array(nb * 169).fill(-1);
  { const cnt = new Int8Array(13);
    for (let i = 0; i < nb; i++) {
      cnt.fill(0); for (const r of boardRanks[i]) cnt[r]++;
      for (let x = 0; x < 13; x++) for (let y = x; y < 13; y++) {
        cnt[x]++; cnt[y]++;
        if (cnt[x] <= 4 && cnt[y] <= 4) TAB[i * 169 + x * 13 + y] = TAB[i * 169 + y * 13 + x] = evalRanks(cnt);
        cnt[x]--; cnt[y]--;
      }
    }
  }
  // Full 7-card evaluator (testing / simple paths)
  function eval7(cards) {
    const cnt = new Int8Array(13), sm = [0, 0, 0, 0];
    for (const c of cards) { cnt[c >> 2]++; sm[c & 3] |= 1 << (c >> 2); }
    let v = evalRanks(cnt);
    for (const m of sm) if (FLUSH[m] > v) v = FLUSH[m];
    return v;
  }

  // Binomials for colex ranking
  const BIN = []; for (let n = 0; n <= 52; n++) { BIN[n] = new Float64Array(7); for (let k = 0; k <= 6; k++) BIN[n][k] = k === 0 ? 1 : n < k ? 0 : (n === k ? 1 : 0); }
  for (let n = 1; n <= 52; n++) for (let k = 1; k <= 6; k++) BIN[n][k] = BIN[n - 1][k - 1] + BIN[n - 1][k];
  const binom = (n, k) => (n < 0 || k < 0 || n < k) ? 0 : BIN[n][k];

  // ── Phase 1: board stats ─────────────────────────────────────────────────
  // spec: { hole:[c,c], board:[known board cards], dealer:[0..1 known dealer cards], dead:[…] }
  // Returns typed arrays indexed by the colex rank of the unknown board subset (indices into `pool`).
  function setup(spec) {
    const used = new Set([...spec.hole, ...spec.board, ...spec.dealer, ...(spec.dead || [])]);
    if (used.size !== spec.hole.length + spec.board.length + spec.dealer.length + (spec.dead || []).length) throw new Error('A card is used twice');
    const pool = []; for (let c = 0; c < 52; c++) if (!used.has(c)) pool.push(c);
    const uB = 5 - spec.board.length;
    const du = 2 - spec.dealer.length;
    const nDealer = du === 2 ? binom(pool.length - uB, 2) : pool.length - uB;
    return { pool, uB, du, nDealer, nBoards: binom(pool.length, uB) };
  }

  // Compute stats for boards whose highest pool index is in [jFrom, jTo) (or all boards).
  function boardStats(spec, ctx, jFrom = 0, jTo = Infinity) {
    const { pool, uB, du } = ctx, n = pool.length;
    // Boards whose largest pool index is j occupy colex ranks [C(j,uB), C(j+1,uB)), so a j-range is
    // one contiguous slice of the full arrays — that is what lets workers split the work.
    const top0 = Math.max(uB - 1, 0);
    const rStart = uB === 0 || jFrom <= top0 ? 0 : BIN[jFrom][uB];
    const rEnd = uB === 0 || jTo >= n ? ctx.nBoards : BIN[jTo][uB];
    const len = rEnd - rStart;
    const out = {
      rStart, rEnd,
      W: new Uint16Array(len), L: new Uint16Array(len),
      Wq: new Uint16Array(len), Lq: new Uint16Array(len), cat: new Uint8Array(len),
    };
    const cBase = new Int8Array(13); for (const c of pool) cBase[c >> 2]++;
    const c = new Int8Array(13);
    const h1 = spec.hole[0] >> 2, h2 = spec.hole[1] >> 2;
    const holeSuit = [0, 0, 0, 0]; for (const x of spec.hole) holeSuit[x & 3] |= 1 << (x >> 2);
    const kb = spec.board.slice().sort((a, b) => a - b);
    const dk = du === 1 ? spec.dealer[0] : -1, dkr = dk >> 2, dks = dk & 3;
    const idx = new Int32Array(Math.max(uB, 1)), cards = new Int32Array(5), inSub = new Uint8Array(52);
    let W, L, Wq, Lq, pv;
    const cls = (dv, w) => { if (dv > pv) { L += w; if (dv >= PAIRV) Lq += w; } else if (dv < pv) { W += w; if (dv >= PAIRV) Wq += w; } };

    const sc = new Int32Array(4), sm = new Int32Array(4);
    const doBoard = (rank) => {
      // merge known board + subset (both sorted card ids → sorted ranks)
      let a = 0, b = 0, k = 0;
      while (k < 5) cards[k++] = (b >= uB || (a < kb.length && kb[a] < pool[idx[b]])) ? kb[a++] : pool[idx[b++]];
      for (let r = 0; r < 13; r++) c[r] = cBase[r];
      for (let t = 0; t < uB; t++) { c[pool[idx[t]] >> 2]--; inSub[pool[idx[t]]] = 1; }
      const bi = BKEY[((((cards[0] >> 2) * 13 + (cards[1] >> 2)) * 13 + (cards[2] >> 2)) * 13 + (cards[3] >> 2)) * 13 + (cards[4] >> 2)];
      const base = bi * 169;
      sc[0] = sc[1] = sc[2] = sc[3] = 0; sm[0] = sm[1] = sm[2] = sm[3] = 0;
      for (let t = 0; t < 5; t++) { sc[cards[t] & 3]++; sm[cards[t] & 3] |= 1 << (cards[t] >> 2); }
      let fs = -1; for (let s = 0; s < 4; s++) if (sc[s] >= 3) fs = s;
      pv = TAB[base + h1 * 13 + h2];
      if (fs >= 0) { const f = FLUSH[sm[fs] | holeSuit[fs]]; if (f > pv) pv = f; }
      // hot loop: classification inlined (a closure call per dealer rank pair was the main cost)
      let w0 = 0, l0 = 0, wq = 0, lq = 0; const p0 = pv;
      if (du === 2) {
        for (let r1 = 0; r1 < 13; r1++) {
          const c1 = c[r1]; if (!c1) continue; const row = base + r1 * 13;
          if (c1 > 1) { const dv = TAB[row + r1], w = c1 * (c1 - 1) >> 1; if (dv > p0) { l0 += w; lq += w; } else if (dv < p0) { w0 += w; wq += w; } } // a pocket pair always qualifies
          for (let r2 = r1 + 1; r2 < 13; r2++) {
            const c2 = c[r2]; if (!c2) continue;
            const dv = TAB[row + r2], w = c1 * c2;
            if (dv > p0) { l0 += w; if (dv >= PAIRV) lq += w; } else if (dv < p0) { w0 += w; if (dv >= PAIRV) wq += w; }
          }
        }
      } else {
        const row = base + dkr * 13;
        for (let r2 = 0; r2 < 13; r2++) {
          const c2 = c[r2]; if (!c2) continue;
          const dv = TAB[row + r2];
          if (dv > p0) { l0 += c2; if (dv >= PAIRV) lq += c2; } else if (dv < p0) { w0 += c2; if (dv >= PAIRV) wq += c2; }
        }
      }
      W = w0; L = l0; Wq = wq; Lq = lq;
      if (fs >= 0) { // dealer flushes: replace the non-flush value for combos that make one
        const m = sc[fs], bm = sm[fs];
        const adj = (x, y) => { // dealer cards x (,y)
          const dv0 = TAB[base + (x >> 2) * 13 + (y >> 2)];
          let mask = bm; if ((x & 3) === fs) mask |= 1 << (x >> 2); if ((y & 3) === fs) mask |= 1 << (y >> 2);
          const f = FLUSH[mask]; if (f <= dv0) return;
          cls(dv0, -1); cls(f, 1);
        };
        if (du === 1) {
          const need = 5 - m - (dks === fs ? 1 : 0);
          for (let i = 0; i < n; i++) { const y = pool[i]; if (inSub[y]) continue; if ((need <= 0) || ((y & 3) === fs && need <= 1)) adj(dk, y); }
        } else if (m === 5) {
          for (let i = 0; i < n; i++) { const x = pool[i]; if (inSub[x]) continue; for (let j = i + 1; j < n; j++) { const y = pool[j]; if (!inSub[y]) adj(x, y); } }
        } else {
          for (let i = 0; i < n; i++) {
            const x = pool[i]; if (inSub[x] || (x & 3) !== fs) continue;
            for (let j = 0; j < n; j++) {
              const y = pool[j]; if (j === i || inSub[y]) continue;
              const ys = (y & 3) === fs;
              if (ys ? j > i : m === 4) adj(x, y);
            }
          }
        }
      }

    const rec = (t, hi, rank) => {
      if (t < 0) { doBoard(rank); return; }
      for (let i = t; i < hi; i++) { idx[t] = i; rec(t - 1, i, rank + BIN[i][t + 1]); }
    };
    const top = uB - 1;
    for (let j = Math.max(jFrom, top); j < Math.min(jTo, n); j++) { idx[top] = j; rec(top - 1, j, BIN[j][uB]); }
    return out;
  }

  // Join worker slices (any order) into full arrays.
  function mergeStats(ctx, parts) {
    const n = ctx.nBoards, st = { W: new Uint16Array(n), L: new Uint16Array(n), Wq: new Uint16Array(n), Lq: new Uint16Array(n), cat: new Uint8Array(n) };
    for (const p of parts) for (const k of ['W', 'L', 'Wq', 'Lq', 'cat']) st[k].set(p[k], p.rStart);
    return st;
  }
  // Split pool indices into chunks of roughly equal work (boards with max index j: C(j, uB-1)).
  function splitWork(ctx, parts) {
    const n = ctx.pool.length, uB = ctx.uB;
    if (uB === 0) return [[0, n]];
    const w = j => binom(j, uB - 1), total = ctx.nBoards, out = [];
    let from = uB - 1, acc = 0;
    for (let j = uB - 1; j < n; j++) { acc += w(j); if (acc >= total / parts * (out.length + 1) && out.length < parts - 1) { out.push([from, j + 1]); from = j + 1; } }
    out.push([from, n]);
    return out;
  }

  // ── Games & paytables ────────────────────────────────────────────────────
  // Payout arrays indexed by pcat: 0 HC 1 P 2 2P 3 Trips 4 Str 5 Flush 6 FH 7 Quads 8 SF 9 Royal
  const GAMES = {
    uth: {
      name: 'Ultimate Texas Hold\'em', spot2: 'Blind', playName: 'Play', preflopBets: [4, 3],
      blind: [0, 0, 0, 0, 1, 1.5, 3, 10, 50, 500],
      trips: {
        'UTH-01': [-1, -1, -1, 3, 4, 7, 9, 30, 40, 50],
        'UTH-02': [-1, -1, -1, 3, 5, 6, 8, 30, 40, 50],
        'UTH-03': [-1, -1, -1, 3, 4, 7, 8, 30, 40, 50],
        'UTH-04': [-1, -1, -1, 3, 5, 6, 7, 20, 40, 50],
      },
    },
    wpt: {
      name: 'WPT Heads-Up Hold\'em', spot2: 'Odds', playName: 'Raise', preflopBets: [3, 2, 1],
      odds: [0, 0, 0, 0, 1, 1.5, 3, 10, 50, 500],
      badBeat: { // paid when we LOSE holding a straight or better (royal can't lose)
        'BB-1': [-1, -1, -1, -1, 5, 8, 10, 50, 500, 500],
        'BB-2': [-1, -1, -1, -1, 5, 6, 10, 50, 500, 500],
        'BB-3': [-1, -1, -1, -1, 4, 5, 10, 50, 500, 500],
        'BB-4': [-1, -1, -1, -1, 4, 5, 6, 25, 500, 500],
      },
      trips: {
        'TP-1': [-1, -1, -1, 3, 4, 7, 9, 30, 40, 100],
        'TP-2': [-1, -1, -1, 3, 5, 6, 8, 30, 40, 100],
        'TP-3': [-1, -1, -1, 3, 4, 7, 8, 30, 40, 100],
        'TP-4': [-1, -1, -1, 3, 5, 6, 7, 30, 40, 100],
      },
      pocket: { 'PB-1': [30, 20, 10, 5], 'PB-2': [25, 20, 10, 5], 'PB-3': [30, 20, 10, 4] }, // AA, suited A+face, offsuit A+face, KK or lower pair
    },
  };

  // spot2 payout per board (summed over dealer hands) for a won / lost / tied hand
  function spot2Fn(game, opts) {
    if (game === 'uth') { const bl = GAMES.uth.blind; return (W, L, cat) => W * bl[cat] - L; }
    const od = GAMES.wpt.odds, bb = GAMES.wpt.badBeat[opts.badBeat || 'BB-1'];
    return (W, L, cat) => W * od[cat] + L * (cat >= 4 ? bb[cat] : -1);
  }

  function pocketEV(hole, table) {
    const r1 = hole[0] >> 2, r2 = hole[1] >> 2, suited = (hole[0] & 3) === (hole[1] & 3);
    if (r1 === r2) return r1 === 12 ? table[0] : table[3];
    const hi = Math.max(r1, r2), lo = Math.min(r1, r2);
    if (hi === 12 && lo >= 9) return suited ? table[1] : table[2];
    return -1;
  }

  // ── Phase 2: decisions ───────────────────────────────────────────────────
  // street: 'preflop' (board.length 0–1, the known card is a flop card), 'flop' (3), 'river' (5)
  function decide(spec, ctx, st, game, opts = {}) {
    const { pool, uB, nDealer: N } = ctx, n = pool.length;
    const f2 = spot2Fn(game, opts);
    const tripsT = GAMES[game].trips[opts.trips || Object.keys(GAMES[game].trips)[0]];
    const street = spec.street || (spec.board.length >= 5 ? 'river' : spec.board.length >= 3 ? 'flop' : 'preflop');

    // per-board EV pieces (sums over the N dealer hands)
    const boardEV = (r) => {
      const W = st.W[r], L = st.L[r], cat = st.cat[r];
      return { ante: st.Wq[r] - st.Lq[r], side: f2(W, L, cat), B: W - L, W, L, Wq: st.Wq[r], Lq: st.Lq[r] };
    };
    // river node: bet 1x vs fold. Returns the optimal path's pieces.
    const river = (r) => {
      const e = boardEV(r);
      const bet = e.ante + e.side + e.B, fold = -2 * N;
      return bet >= fold ? { ante: e.ante, side: e.side, play: e.B, folded: 0 } : { ante: -N, side: -N, play: 0, folded: 1 };
    };

    // Trips: every board completion equally likely; dealer cards don't matter
    let tripsSum = 0; for (let r = 0; r < ctx.nBoards; r++) tripsSum += tripsT[st.cat[r]];
    const hist = new Array(10).fill(0); for (let r = 0; r < ctx.nBoards; r++) hist[st.cat[r]]++;
    const res = { street, N, boards: ctx.nBoards, trips: tripsSum / ctx.nBoards, catHist: hist.map(x => x / ctx.nBoards) };
    if (game === 'wpt') res.pocket = pocketEV(spec.hole, GAMES.wpt.pocket[opts.pocket || 'PB-1']);

    // "Bet now" outcome breakdown (dealer qualifies / win / lose)
    let sW = 0, sL = 0, sWq = 0, sLq = 0, sQ = 0;
    // We need dealer-qualify counts: Wq+Lq+ties-with-qualify; ties ignored for qualify rate here.
    for (let r = 0; r < ctx.nBoards; r++) { sW += st.W[r]; sL += st.L[r]; sWq += st.Wq[r]; sLq += st.Lq[r]; }
    const tot = ctx.nBoards * N;
    res.outcome = { win: sW / tot, lose: sL / tot, tie: (tot - sW - sL) / tot, winQ: sWq / tot, loseQ: sLq / tot };

    if (street === 'river') {
      const e = boardEV(0), rv = river(0);
      res.actions = {
        bet1: { ante: e.ante / N, side: e.side / N, play: e.B / N },
        fold: { ante: -1, side: -1, play: 0 },
      };
      finish(res);
      return res;
    }

    // Enumerate (flop completion, turn+river) and fold up decisions.
    const rankOf = (sorted) => { let r = 0; for (let t = 0; t < sorted.length; t++) r += BIN[sorted[t]][t + 1]; return r; };
    const flopU = street === 'flop' ? 0 : 3 - spec.board.length;
    const tmp = new Int32Array(uB);
    const F = new Int32Array(Math.max(flopU, 1)), used = new Uint8Array(n);
    // preflop accumulators
    const P = { ante: 0, side: 0, B: 0, chk: { ante: 0, side: 0, play: 0 }, flopBet: 0, riverBet: 0, riverFold: 0, nBoards: 0, nFlops: 0 };

// ── Pre-seeding the shared cache (browser console) ────────────────────────
// seedCache()                                  → common preflop charts for the selected game
// seedCache({ kinds: ['dealer', 'flop', 'flop+dealer'], variants: ['uth', 'wpt-bb-1'] })
// seedCache({ kinds: ['dead1', 'dead2'] })     → charts for 1 or 2 seen player cards (dead2 is an overnight job)
// seedCache({ kinds: ['dead2'], part: [1, 2] }) on one device and part: [2, 2] on another → split the work
// seedCache.list()  → what would be done      seedCache.stop() → stop after the current chart
// Each new chart is one KV write. Cloudflare's free plan allows 1,000 writes a day for the whole account
// (the Loot Dashboard shares it), so a run stops after `max` saves (default 600) or when saving keeps failing.
// Charts already in the cache are skipped (so runs can be stopped, resumed or split). Needs the write token.
function seedScenarios(kinds) {
  const out = [], seen = new Set();
  const add = kn => { const k = chartKnownKey(kn); if (!seen.has(k)) { seen.add(k); out.push(kn); } };
  const card = (r, s) => r * 4 + s;
  for (const kind of kinds) {
    if (kind === 'dealer') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [], dealer: [card(r, 0)], dead: [] });
    if (kind === 'flop') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [card(r, 0)], dealer: [], dead: [] });
    if (kind === 'flop+dealer') for (let r1 = 12; r1 >= 0; r1--) for (let r2 = 12; r2 >= 0; r2--) for (const ss of [0, 1]) {
      if (r1 === r2 && ss === 0) continue; // same rank → must be different suits
      add({ street: 'preflop', board: [card(r1, 0)], dealer: [card(r2, ss)], dead: [] });
    }
    // other players' cards (nothing else known): 13 single cards, 169 pairs (same suit / different suit / paired)
    if (kind === 'dead1') for (let r = 12; r >= 0; r--) add({ street: 'preflop', board: [], dealer: [], dead: [card(r, 0)] });
    if (kind === 'dead2') for (let r1 = 12; r1 >= 0; r1--) for (let r2 = r1; r2 >= 0; r2--) for (const ss of [0, 1]) {
      if (r1 === r2 && ss === 0) continue;
      add({ street: 'preflop', board: [], dealer: [], dead: [card(r1, 0), card(r2, ss)] });
    }
  }
  return out;
}
let seedStop = false;
// part: [i, n] takes every n-th chart starting at i (1-based), to split a long run across devices.
async function seedCache({ kinds = ['dealer', 'flop', 'flop+dealer'], variants = [variantKey()], part = [1, 1], max = 600 } = {}) {
  if (!workerBase()) return console.warn('No cf_worker_url in config.json — nothing to seed into.');
  if (!writeToken) return console.warn('Save the write token first (bottom of the page).');
  seedStop = false;
  let jobs = []; for (const v of variants) for (const kn of seedScenarios(kinds)) jobs.push([v, kn]);
  jobs = jobs.filter((_, i) => i % part[1] === part[0] - 1);
  let wake = null; try { wake = await navigator.wakeLock?.request('screen'); } catch (_) {} // keep the screen (and the run) awake
  console.log(`Seeding up to ${jobs.length} charts (${kinds.join(', ')} × ${variants.join(', ')}${part[1] > 1 ? `, part ${part[0]} of ${part[1]}` : ''}). seedCache.stop() to stop. Keep this tab open.`);
  const t0 = performance.now(); let made = 0, skipped = 0, failed = 0, timeMade = 0, failRun = 0;
  for (let i = 0; i < jobs.length; i++) {
    if (seedStop) { console.log('Stopped.'); break; }
    if (made >= max) { console.log(`Reached ${max} saves for this run (KV write budget). Run seedCache() again tomorrow to carry on — finished charts are skipped.`); break; }
    if (failRun >= 3) { console.warn('Saving failed 3 times in a row — probably the daily KV write limit. Stopping; run it again after the daily reset (midnight UTC).'); break; }
    const [v, kn] = jobs[i], key = chartKvKey(v, kn);
    const label = `${v} ${kn.board.length ? 'flop ' + E.cardStr(kn.board[0]) : ''} ${kn.dealer.length ? 'dealer ' + E.cardStr(kn.dealer[0]) : ''} ${kn.dead.length ? 'seen ' + kn.dead.map(E.cardStr).join(' ') : ''}`.replace(/\s+/g, ' ').trim();
    if (await kvGet(key)) { skipped++; continue; }
    const t = performance.now();
    try {
      const data = await computeChart(kn, v, { prio: 0 });
      const ok = await kvPut(key, data); if (!ok) throw new Error('save failed');
      chartMem.set(`${v}|${chartKnownKey(kn)}`, { key, street: 'preflop', data, base: baselineChart(v), complete: true });
      made++; failRun = 0; timeMade += performance.now() - t;
      const left = jobs.length - i - 1, eta = timeMade / made * left / 60000;
      console.log(`✓ ${label} — ${((performance.now() - t) / 1000).toFixed(0)} s · ${i + 1}/${jobs.length} · up to ~${eta.toFixed(0)} min left`);
    } catch (e) { failed++; if (e.message === 'save failed') failRun++; console.warn(`✗ ${label}: ${e.message}`); }
  }
  console.log(`Done: ${made} computed, ${skipped} already cached, ${failed} failed, ${((performance.now() - t0) / 60000).toFixed(1)} min.`);
  try { await wake?.release(); } catch (_) {}
}
seedCache.stop = () => { seedStop = true; };
seedCache.list = (opts = {}) => {
  const k = opts.kinds || ['dealer', 'flop', 'flop+dealer'], v = opts.variants || [variantKey()];
  for (const kind of k) console.log(`${kind}: ${seedScenarios([kind]).length * v.length} charts`);
  const n = seedScenarios(k).length * v.length; console.log(`total ${n} charts × ${v.join(', ')}`); return n;
};
window.seedCache = seedCache;

// ── Quiz: play whole hands ────────────────────────────────────────────────
// Every hand starts preflop and is played until you bet (or fold on the river). The cards are all
// dealt up front and each decision point is solved exactly; at the end every decision you made is
// graded against the best play at that point, and the EV you gave up is added up for the hand.
// The dealer card / early flop card appear at random when those settings are on.
// A "tough spot": the best option is ahead of the other by less than this (antes). Preflop it's kept to
// hands right at the edge of the raising range: 0.015 per unit of the max raise (UTH 0.06, WPT 0.045).
const TOUGH = 0.15;
const toughLimit = st => st === 'preflop' ? 0.015 * maxPreflopRaise() : TOUGH;
const QZ = {
  tough: store.get('uth.qTough', false),
  stats: Object.assign({ n: 0, perfect: 0, lost: 0, streak: 0, best: 0 }, store.get('uth.qStats2', {})),
  cur: null, next: null, seq: 0,
};
const saveQuiz = () => { store.set('uth.qTough', QZ.tough); store.set('uth.qStats2', QZ.stats); };
const quizKey = () => [S.game, variantKey(), S.peekDealer, S.peekFlop, QZ.tough, S.game === 'wpt' ? JSON.stringify(S.wptRaises) : ''].join('|');
const QSTREETS = ['preflop', 'flop', 'river'], QNAME = { preflop: 'Preflop', flop: 'Flop', river: 'River' };
function quizActions(street, game) {
  if (street === 'flop') return ['bet2', 'check'];
  if (street === 'river') return ['bet1', 'fold'];
  return ['bet' + (game === 'uth' ? 4 : [3, 2, 1].find(m => S.wptRaises[m])), 'check']; // smaller raises are never best (see allowedAction)
}
const qBest = (acts, st) => quizActions(st, S.game).reduce((a, k) => acts[k] > acts[a] ? k : a);
const qGap = (acts, st) => { const v = quizActions(st, S.game).map(k => acts[k]).sort((x, y) => y - x); return v[0] - v[1]; };

function quizDeal() {
  const deck = [...Array(52).keys()];
  for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  const hole = [deck.pop(), deck.pop()], board = [deck.pop(), deck.pop(), deck.pop(), deck.pop(), deck.pop()];
  return { hole, board, dealer: S.peekDealer && Math.random() < 0.5 ? [deck.pop()] : [], peekF: S.peekFlop && Math.random() < 0.5 };
}
const nodeSpec = (h, st) => ({ hole: h.hole, board: st === 'preflop' ? (h.peekF ? [h.board[0]] : []) : st === 'flop' ? h.board.slice(0, 3) : h.board.slice(), dealer: h.dealer, dead: [], street: st });
async function nodeSolve(sp) {
  if (sp.street === 'preflop' && !sp.board.length && !sp.dealer.length && BASE) {
    const b = BASE[handClass(sp.hole)]?.games[S.game === 'uth' ? 'uth' : 'wpt:' + S.tables.badBeat];
    if (b) return Object.fromEntries(Object.entries(b.actions).map(([k, x]) => [k, x.total]));
  }
  return (await runJob({ type: 'solve', spec: sp, game: S.game, opts: gameOpts() }, { prio: 2 })).res.actions;
}
async function quizMake() {
  const key = quizKey();
  for (let tries = 0; ; tries++) {
    const h = quizDeal();
    if (!QZ.tough || tries >= 30) {
      const solved = await Promise.all(QSTREETS.map(st => nodeSolve(nodeSpec(h, st))));
      h.acts = Object.fromEntries(QSTREETS.map((st, i) => [st, solved[i]]));
      return { h, key };
    }
    // Tough spots: walk the best line street by street, solving only as far as needed, and keep
    // the hand once it passes a close call (then fill in the remaining streets).
    h.acts = {}; let found = false;
    for (const st of QSTREETS) {
      h.acts[st] = await nodeSolve(nodeSpec(h, st));
      if (qGap(h.acts[st], st) < toughLimit(st)) { found = true; break; }
      if (endsHand(qBest(h.acts[st], st), st)) break;
    }
    if (!found) continue;
    const rest = QSTREETS.filter(st => !h.acts[st]), solved = await Promise.all(rest.map(st => nodeSolve(nodeSpec(h, st))));
    rest.forEach((st, i) => h.acts[st] = solved[i]);
    return { h, key };
  }
}
function quizPrefetch() { QZ.next = quizMake().catch(() => null); }
async function quizNew() {
  const seq = ++QZ.seq;
  if (!QZ.next) quizPrefetch();
  QZ.cur = null; renderQuiz();
  let q = await QZ.next;
  if (seq !== QZ.seq) return;
  if (!q || q.key !== quizKey()) { quizPrefetch(); q = await QZ.next; if (seq !== QZ.seq) return; } // settings changed since it was dealt
  QZ.cur = { ...q, stage: 'preflop', picks: [], done: false };
  quizPrefetch(); // the next hand gets dealt and solved while this one is played

}
function quizGrade(q) {
  const rows = q.picks.map(p => {
    const acts = q.h.acts[p.st], best = qBest(acts, p.st);
    return { ...p, acts, best, loss: Math.max(0, acts[best] - acts[p.k]), gain: qGap(acts, p.st), tough: qGap(acts, p.st) < toughLimit(p.st) };
  });

  // where would the best line have ended?

  for (const st of QSTREETS) { const b = qBest(q.h.acts[st], st); if (endsHand(b, st)) { bestEnd = { st, k: b }; break; } }

document.getElementById('clearAll').onclick = () => { S.hole = [null, null]; S.board = [null, null, null, null, null]; S.dealer = [null]; S.dead = []; S.active = 'hole'; render(); onCardsChanged(); };

(async () => {
  initWorkers();
  document.querySelectorAll('#gameSeg button').forEach(x => x.classList.toggle('on', x.dataset.g === S.game));
  document.querySelectorAll('#streetSeg button').forEach(x => x.classList.toggle('on', x.dataset.s === S.street));
  renderOpts(); render(); renderToken(); renderResults(); setTab(S.tab);
  try { const c = await fetch('config.json?t=' + Date.now()); if (c.ok) Object.assign(CFG, await c.json()); } catch (_) {}
  if (CFG.kv_prefix && !CFG.kv_prefix.endsWith('/')) CFG.kv_prefix += '/';
  setKvStatus(workerBase() ? `Shared cache: ${CFG.kv_prefix}` : 'Shared cache: off (no config.json)');
  try { const b = await fetch('baselines.json'); if (b.ok) BASE = await b.json(); } catch (_) {}
  CH = null; buildChart();
  setMode(mode);
})();
</script>
</body>
</html>
